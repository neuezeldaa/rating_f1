# Пересчёт рейтинга и публикация сайта на GitHub Pages.
#
# Запускается каждый понедельник после гоночных выходных, при каждом push в main
# и по кнопке Run workflow на вкладке Actions. Скачанные данные (data/raw) хранятся
# в кэше Actions между запусками, прошлые сезоны есть ещё и в data/seed.zip.
# Отчёт запуска (Summary): данные по какой гонке, топ и проверки рейтинга.
# Тесты идут до пересчёта, проверки данных — после: если что-то не так, сайт не обновляется.
#
# В настройках репозитория: Settings → Pages → Source: GitHub Actions.

name: Обновление рейтинга

on:
  schedule:
    - cron: "0 6 * * 1"   # понедельник, 06:00 UTC (09:00 по Москве)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Один запуск за раз: новый ждёт окончания текущего, а не отменяет его.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # С 1996 года сезонов 31: обычный запуск — около 30 минут, с проверкой прогнозом (раз в 35 дней
    # и при ручном запуске) — около 45. Лимит с запасом; для публичного репозитория это бесплатно.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt

      - name: Зависимости (версии — как в constraints.txt)
        run: pip install -c constraints.txt -e ".[dev]"

      # Тесты ключевых расчётов — до пересчёта: если что-то сломано в коде, сайт не трогаем.
      - name: Тесты
        run: python -I -m pytest -q

      - name: Кэш скачанных данных
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      # Если кэш пропал (GitHub удаляет его через 7 дней без обращений), прошлые сезоны берутся
      # из data/seed.zip, а не скачиваются заново.
      - name: Начальные данные
        run: python -I -m rating_f1.seed unpack

      # Проверка прогнозом — самая долгая часть: при ручном запуске считается заново,
      # в остальных — берётся из прошлого прогона, пока ей меньше 35 дней.
      - name: Пайплайн
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python -I -m rating_f1.pipeline
          else
            python -I -m rating_f1.pipeline --reuse-backtest
          fi

      - name: Отчёт запуска
        run: python -I -m rating_f1.report >> "$GITHUB_STEP_SUMMARY"

      # Проверки того, что увидит посетитель; не пройдены — выкладки нет, на сайте остаётся прошлая версия.
      - name: Проверки перед публикацией
        run: python -I -m rating_f1.checks

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
