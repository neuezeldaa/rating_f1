# Гонки под дождём или со стартом на мокрой трассе, когда до промежуточной резины дело дошло
# у большинства (не считая лёгкой мороси, которую проехали на сликах).
#
# reviewed — до какого этапа сезон проверен по отчётам о гонках: остальные проверенные гонки сухие.
# Непроверенные этапы пайплайн размечает по осадкам Open-Meteo (реанализ ошибается — это только
# подсказка) и пишет в лог, какие гонки стоит проверить и вписать сюда.
# no_racing — гонка формально засчитана, но борьбы не было (только круги за машиной безопасности):
# в «дождь» не идёт.
#
# Названия — как у Jolpica (поле raceName).

# 1996–1999. Сухими проверены, хотя по осадкам Open-Meteo похожи на дождевые: Сан-Марино-1997,
# Бразилия-1998, Италия-1998; Франция-1997 (дождь в конце, но большинство осталось на сликах),
# Аргентина-1998 (морось в последних кругах, резину не меняли).
1996: {reviewed: 16, wet: [Brazilian Grand Prix, Spanish Grand Prix, Monaco Grand Prix]}
1997: {reviewed: 17, wet: [Monaco Grand Prix, Belgian Grand Prix]}
1998: {reviewed: 16, wet: [British Grand Prix, Belgian Grand Prix]}
1999: {reviewed: 16, wet: [French Grand Prix, European Grand Prix]}

# 2000–2010. Сухими проверены: Великобритания-2000 (дождливым был уик-энд, гонка — сухая),
# Япония-2000 (морось без смены резины). Бельгия-2005: дождя в гонке не было, но трасса оставалась
# мокрой — все стартовали и большинство доехало на промежуточной резине.
