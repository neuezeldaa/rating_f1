# Гонки под дождём или со стартом на мокрой трассе, когда до промежуточной резины дело дошло
# у большинства (не считая лёгкой мороси, которую проехали на сликах).
#
# reviewed — до какого этапа сезон проверен по отчётам о гонках: остальные проверенные гонки сухие.
# Непроверенные этапы пайплайн размечает по осадкам Open-Meteo (реанализ ошибается — это только
# подсказка) и пишет в лог, какие гонки стоит проверить и вписать сюда.
# no_racing — гонка формально засчитана, но борьбы не было (только круги за машиной безопасности):
# в «дождь» не идёт.
#
# Названия — как у Jolpica (поле raceName).

